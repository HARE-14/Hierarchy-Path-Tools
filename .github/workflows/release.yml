name: Create Release
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: write

env:
  PACKAGE_NAME: Hierarchy-Path-Tools

jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: meta
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Check tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${{ github.ref_name }}" != "${{ steps.meta.outputs.version }}" ]; then
            echo "tag ${{ github.ref_name }} != package.json ${{ steps.meta.outputs.version }}"
            exit 1
          fi

      - name: Make zip
        run: |
          mkdir -p output
          zip -r "output/$PACKAGE_NAME-${{ steps.meta.outputs.version }}.zip" . \
            -x '.git/*' -x '.github/*' -x 'output/*' -x '.gitignore' -x '.gitattributes'

      - name: Make unitypackage
        uses: weasel-club/unitypackage-release-action@v1
        with:
          output_dir: output
          packages_json: |
            [
              {
                "package_name": "HierarchyPathTools",
                "output_file_name": "${{ env.PACKAGE_NAME }}-${{ steps.meta.outputs.version }}.unitypackage",
                "include_roots": ["Editor", "package.json", "README.md", "LICENSE"],
                "target_root": "Assets/HARE_Studio/HierarchyPathTools"
              }
            ]

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.version }}
          name: ${{ steps.meta.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            output/${{ env.PACKAGE_NAME }}-${{ steps.meta.outputs.version }}.zip
            output/${{ env.PACKAGE_NAME }}-${{ steps.meta.outputs.version }}.unitypackage
            package.json
